name: test
on: [pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@002fdce3c6a235733a90a27c80493a3241e56863 # v2.12.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Java
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: Test
        run: mvn -B test

      - name: Javadoc
        run: mvn -B javadoc:javadoc

      - name: Generator tests
        run: mvn -B -f tools/model-generator/pom.xml test

  generated-sdk:
    # Regenerates the SDK from the committed spec inside the disposable CI checkout and proves the
    # result compiles and passes the SDK tests. Generated output is not committed in this phase;
    # once a baseline is committed, `make check-generated` replaces this job as the gate.
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@002fdce3c6a235733a90a27c80493a3241e56863 # v2.12.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Java
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: Check generation drift against the vended SDK
        # Regenerating from the committed spec may only change the files listed in
        # tools/model-generator/config/expected-generation-changes.txt.
        run: make check-surface

      - name: Generate SDK from committed spec
        run: make generate

      - name: Test generated SDK
        run: mvn -B test
