          example: BTC
        vol_5d:
          type: string
          description: "Daily historical volatility over trailing 5 days (decimal,\
            \ e.g., 0.65 = 65%)"
          example: "0.65"
        vol_30d:
          type: string
          description: "Daily historical volatility over trailing 30 days (decimal,\
            \ e.g., 0.65 = 65%)"
          example: "0.65"
        vol_90d:
          type: string
          description: "Daily historical volatility over trailing 90 days (decimal,\
            \ e.g., 0.65 = 65%)"
          example: "0.65"
        adv_30d:
          type: string
          description: Average daily trading volume over trailing 30 days (USD)
          example: "1234567.89"
        weighted_vol:
          type: string
          description: Weighted blend of the most recent vol_5d and the max vol_5d
            over last 30 days into a single volatility measure (decimal).
          example: "0.0345"
