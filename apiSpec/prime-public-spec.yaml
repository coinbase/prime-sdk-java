          description: USD notional value of the remaining amount
          example: "5726.59"
    coinbase.public_rest_api.XMLiquidationDetail:
      title: XMLiquidationDetail provides detailed information about a single XM liquidation
      type: object
      properties:
        liquidation_id:
          type: string
