              type: object
              properties:
                designated_funding_portfolio_id:
                  type: string
                  description: Set the Derivatives Funding Portfolio that will be
                    used to fund FCM margin calls and receive excess margin sweeps.
                    Only one portfolio per entity.
                  example: a0724c0c-0f9e-4525-baf4-1aa8fce77eb2
                automatic_conversion_enabled:
                  type: boolean
                  description: "When true, USDC in your Derivatives Funding Portfolio\
                    \ will be converted to USD to meet FCM margin calls (Auto-Convert\
                    \ USDC)."
                automatic_loan_enabled:
                  type: boolean
                  description: "Deprecated: Auto-Initiate Loans is now always enabled\
                    \ for Financing customers. Any value sent for this field is ignored."
                automatic_excess_return_enabled:
                  type: boolean
                  description: "When true, any FCM account balance above your margin\
                    \ requirements will be automatically swept back to your Derivatives\
                    \ funding portfolio. (Auto-Return Excess Margin)"
                excess_funds_target_amount:
