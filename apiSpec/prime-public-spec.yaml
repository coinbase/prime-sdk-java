    coinbase.public_rest_api.WalletStakeInputs:
      type: object
      properties:
        amount:
          type: string
          description: "Optional amount to stake (ETH only). If omitted, the wallet\
            \ will stake the maximum amount available"
        validator_address:
          type: string
          description: "Optional validator address, defaults to Coinbase validator.\
            \ For SOL, must be the vote account address. Ignored for ETH."
        end_date:
          type: string
          description: Optional delegation end date in ISO date format (e.g. 2026-07-15).
            Required for AVAX; minimum 14-day delegation period applies.
      description: |-
        WalletStakeInputs contains the custom inputs for staking operations on a wallet.
        Requirements and supported fields vary by asset type.
    coinbase.public_rest_api.WalletStakingMetadata:
      type: object
      properties:
        external_id:
          type: string
          description: An optional custom identifier (up to 255 bytes) to attach to
            the transaction. This is not a searchable transaction field. Retries with
            the same idempotency_key must use the same external_id; a differing value
            on retry will be silently ignored.
      description: |-
        WalletStakingMetadata contains optional metadata for wallet staking requests.
        external_id tags the discrete TWS transaction stake/unstake create; automatic reward crediting (e.g. SOL inflation) does not produce one.
        StakingClaimRewardsRequest intentionally omits this field; add metadata to claim rewards only if a supported network's claim flow creates a discrete TWS transaction clients need to tag.
    coinbase.public_rest_api.WalletType:
      title: Indicates the wallet type
      type: string
      description: |-
        - VAULT: A crypto vault
         - TRADING: A trading wallet
         - WALLET_TYPE_OTHER: Other wallet types (like consumer, etc)
         - QC: A QC Wallet
         - ONCHAIN: An Onchain wallet
      enum:
      - VAULT
      - TRADING
      - WALLET_TYPE_OTHER
      - QC
      - ONCHAIN
    coinbase.public_rest_api.WalletUnstakeInputs:
      type: object
