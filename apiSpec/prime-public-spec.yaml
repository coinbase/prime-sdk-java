          example: "100000"
        product_type:
          $ref: '#/components/schemas/coinbase.public_rest_api.ProductType'
        commission_detail_total:
          $ref: '#/components/schemas/coinbase.public_rest_api.CommissionDetailTotal'
        is_buy_exact:
          type: boolean
          description: Indicates if this was a buy exact order (fees charged on top
            of quote size for BUY orders sized in quote)
          example: false
