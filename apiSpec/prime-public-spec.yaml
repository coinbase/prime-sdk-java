    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: The amount and validator_provider fields are mutually exclusive;
      specify at most one.
  - name: STAKING_VALIDATOR_PROVIDER_REQUIRED
    errorCode: REQUIRED_FIELD_MISSING
    httpStatus: 400
    description: The validator_provider field is required for a provider-scoped unstake
      request.
  - name: STAKING_VALIDATOR_PROVIDER_NOT_SUPPORTED
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: The validator_provider value provided is not a supported provider.
  - name: COMMISSION_PRODUCT_ID_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: The product_id is not a recognized trading pair.
  - name: COMMISSION_TRADING_NOT_ENABLED
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: "The portfolio_id belongs to a portfolio that is not enabled for\
      \ trading, so a trading commission rate cannot be calculated for it."
  - name: ADVANCED_TRANSFER_NOT_ENABLED
    errorCode: PERMISSION_DENIED
    httpStatus: 403
    description: "Advanced Transfers are not enabled for this portfolio, or the specific\
      \ transfer configuration requested is not enabled for this portfolio."
  - name: ADVANCED_TRANSFER_REQUEST_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: "The advanced transfer request is malformed or fails validation,\
      \ such as a missing portfolio_id, a missing or unsupported transfer type, or\
      \ an invalid fund movement."
  - name: ADVANCED_TRANSFER_ID_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: The advanced_transfer_id provided does not correspond to a transfer
      that can be cancelled.
  - name: ADVANCED_TRANSFER_CANCEL_PRECONDITION_FAILED
    errorCode: FAILED_PRECONDITION
    httpStatus: 400
    description: The advanced transfer cannot be cancelled because it is no longer
      in a cancellable state.
  - name: ADVANCED_TRANSFER_PRECONDITION_FAILED
    errorCode: FAILED_PRECONDITION
    httpStatus: 400
    description: "The advanced transfer cannot be processed because a precondition\
      \ was not met, such as no wallet being available in the portfolio for one of\
      \ the fund movement currencies."
  - name: ADVANCED_TRANSFER_SERVICE_UNAVAILABLE
    errorCode: SERVICE_UNAVAILABLE
    httpStatus: 503
    description: The service needed to process this advanced transfer request is currently
      unavailable or has reached a rate limit.
  - name: ADVANCED_TRANSFER_DATE_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: "The settlement_date, settlement_time, or trade_date field is not\
      \ in the expected format."
  - name: ADVANCED_TRANSFER_NOT_FOUND
    errorCode: RESOURCE_NOT_FOUND
    httpStatus: 404
    description: A resource referenced by the advanced transfer request could not
      be found.
  - name: ADVANCED_TRANSFER_TOO_MANY_FUND_MOVEMENTS
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: The advanced transfer includes more fund movements than the maximum
      number of legs allowed per transfer.
  - name: ADVANCED_TRANSFER_COUNTERPARTY_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: The fund movements in this advanced transfer do not all settle against
      the same counterparty; all legs must share a single counterparty.
  - name: ADVANCED_TRANSFER_AMOUNT_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: The amount on one or more fund movements is not a valid positive
      decimal value.
  - name: ADVANCED_TRANSFER_COUNTERPARTY_REQUIRED
    errorCode: REQUIRED_FIELD_MISSING
    httpStatus: 400
    description: One or more fund movements is missing its counterparty identifier.
  - name: ONCHAIN_TRANSACTION_REQUEST_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: "The onchain transaction request failed validation because of an\
      \ invalid parameter, an unsupported wallet type, or a malformed evm_params value."
  - name: ONCHAIN_ADDRESS_GROUP_REQUEST_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: "The onchain address group create, update, or delete request contained\
      \ invalid data and could not be processed."
  - name: ONCHAIN_TRANSACTION_RAW_UNSIGNED_TXN_REQUIRED
    errorCode: REQUIRED_FIELD_MISSING
    httpStatus: 400
    description: The raw_unsigned_txn field is required but was not provided.
  - name: ONCHAIN_TRANSACTION_RAW_UNSIGNED_TXN_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: The raw_unsigned_txn field is not a valid hex-encoded string.
  - name: ONCHAIN_TRANSACTION_EVM_PARAMS_REQUIRED
    errorCode: REQUIRED_FIELD_MISSING
    httpStatus: 400
    description: The evm_params field is required when the destination wallet is on
      an EVM-based network.
  - name: ONCHAIN_TRANSACTION_EVM_PARAMS_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: "The evm_params field was provided but the destination wallet is\
      \ on a non-EVM network, such as Solana, where EVM-specific parameters are not\
      \ supported."
  - name: ONCHAIN_TRANSACTION_REPLACED_TRANSACTION_ID_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: The replaced_transaction_id field is not a valid transaction identifier.
  - name: ONCHAIN_TRANSACTION_DISABLE_DYNAMIC_NONCE_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: The disable_dynamic_nonce field must be false when replaced_transaction_id
      is set to replace an existing transaction.
  - name: ONCHAIN_TRANSACTION_CHAIN_ID_REQUIRED
    errorCode: REQUIRED_FIELD_MISSING
    httpStatus: 400
    description: The chain_id field is required within evm_params for transactions
      on EVM-based networks.
  - name: ONCHAIN_TRANSACTION_CHAIN_ID_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: "The chain_id field is not a valid integer, or it must be 1 when\
      \ using the Flashbots RPC endpoint."
  - name: ONCHAIN_TRANSACTION_NETWORK_NAME_REQUIRED
    errorCode: REQUIRED_FIELD_MISSING
    httpStatus: 400
    description: The network_name field is required when submitting a transaction
      through a custom RPC endpoint.
  - name: ONCHAIN_TRANSACTION_RPC_URL_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: "The custom RPC endpoint provided cannot be used, either because\
      \ the wallet is not on an EVM-based network or because the call to that endpoint\
      \ failed."
