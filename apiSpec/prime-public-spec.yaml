        validator_allocations:
          type: array
          description: (Alpha) Optional validator-level allocations for ETH V2 unstaking.
            Allows specifying which validators to unstake from and how much. This
            feature is in alpha. Please reach out to your Coinbase Prime account manager
            for more information
          items:
