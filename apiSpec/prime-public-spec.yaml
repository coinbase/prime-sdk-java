openapi: 3.0.1
info:
  title: REST API
  description: "The Coinbase Prime REST API provides programmatic access to trading,\
    \ custody, staking, market data, and account management functionality."
  version: "0.1"
servers:
- url: https://api.prime.coinbase.com/
tags:
- name: PrimeRESTAPI
- name: Error Codes
  description: Global reference of error codes and subcodes returned by the Prime
    REST API.
  x-error-codes:
  - name: RESOURCE_NOT_FOUND
    httpStatus: 404
    description: The requested resource could not be found.
  - name: VALIDATION_ERROR
    httpStatus: 400
    description: One or more request fields are invalid or incompatible.
  - name: REQUIRED_FIELD_MISSING
    httpStatus: 400
    description: A required request field was not provided.
  - name: FAILED_PRECONDITION
    httpStatus: 400
    description: The request could not be completed because a required precondition
      was not met.
  - name: AUTHENTICATION_FAILED
    httpStatus: 401
    description: The request could not be authenticated. Check that the credentials
      supplied with the request are valid.
  - name: PERMISSION_DENIED
    httpStatus: 403
    description: You do not have permission to perform this action with the current
      API key.
  - name: RATE_LIMIT_EXCEEDED
    httpStatus: 429
    description: You have exceeded the request rate limit. Reduce your request rate
      and retry after a backoff period.
  - name: INTERNAL_ERROR
    httpStatus: 500
    description: "An unexpected internal error occurred while processing the request.\
      \ If this persists, contact support."
  - name: NOT_IMPLEMENTED
    httpStatus: 501
    description: This endpoint or operation is not yet implemented.
  - name: SERVICE_UNAVAILABLE
    httpStatus: 503
    description: The service is temporarily unavailable. Retry the request after a
      backoff period.
  x-subcodes:
  - name: AUTH_AUTHORIZATION_FAILED
    errorCode: INTERNAL_ERROR
    httpStatus: 500
    description: "An unexpected error occurred while authorizing the request. If this\
      \ persists, contact support."
  - name: AUTH_RESOURCE_ACCESS_DENIED
    errorCode: PERMISSION_DENIED
    httpStatus: 403
    description: You do not have permission to access this resource with the current
      API key.
  - name: AUTH_RESOURCE_NOT_FOUND
    errorCode: RESOURCE_NOT_FOUND
    httpStatus: 404
    description: "No resource was found matching the request, or you do not have access\
      \ to it."
  - name: AUTH_UNAUTHENTICATED
    errorCode: AUTHENTICATION_FAILED
    httpStatus: 401
    description: The request could not be authenticated. Check that the credentials
      supplied with the request are valid.
  - name: ENDPOINT_NOT_IMPLEMENTED
    errorCode: NOT_IMPLEMENTED
    httpStatus: 501
    description: This endpoint is not yet implemented.
  - name: SERVER_MAINTENANCE_MODE_ACTIVE
    errorCode: SERVICE_UNAVAILABLE
    httpStatus: 503
    description: The API is currently in maintenance mode and not accepting this request.
      Maintenance windows can be extended; check https://status.prime.coinbase.com
      before retrying.
  - name: SERVER_RATE_LIMIT_EXCEEDED
    errorCode: RATE_LIMIT_EXCEEDED
    httpStatus: 429
    description: You have exceeded the request rate limit for this endpoint. Reduce
      your request rate and retry after a backoff period.
  - name: MTLS_CERTIFICATE_REQUIRED
    errorCode: PERMISSION_DENIED
    httpStatus: 403
    description: A valid client certificate was not presented with the request.
  - name: MTLS_CERTIFICATE_REVOKED
    errorCode: PERMISSION_DENIED
    httpStatus: 403
    description: The presented client certificate has been revoked.
  - name: MTLS_CERTIFICATE_INVALID
    errorCode: PERMISSION_DENIED
    httpStatus: 403
    description: The presented client certificate is not a valid identity for this
      organization or environment.
  - name: ENTITY_ID_REQUIRED
    errorCode: REQUIRED_FIELD_MISSING
    httpStatus: 400
    description: The entity_id field is required but was not provided.
  - name: ENTITY_ID_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: The entity_id is not a valid UUID.
  - name: ENTITY_NOT_FOUND
    errorCode: RESOURCE_NOT_FOUND
    httpStatus: 404
    description: No entity was found matching the provided entity_id.
  - name: ENTITY_BALANCES_LIMIT_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: The limit parameter for entity balances is out of the valid range.
  - name: ENTITY_BALANCES_INVALID_ARGUMENT
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: The entity balances request contains an invalid cursor or filter.
  - name: ENTITY_BALANCES_NOT_FOUND
    errorCode: RESOURCE_NOT_FOUND
    httpStatus: 404
    description: No balances were found for the requested entity.
  - name: PORTFOLIO_NOT_FOUND
    errorCode: RESOURCE_NOT_FOUND
    httpStatus: 404
    description: No portfolio was found matching the provided portfolio_id.
  - name: PORTFOLIO_ID_REQUIRED
    errorCode: REQUIRED_FIELD_MISSING
    httpStatus: 400
    description: The portfolio_id field is required but was not provided.
  - name: PORTFOLIO_TYPE_UNSUPPORTED
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: The portfolio's type does not support this operation.
  - name: PORTFOLIO_ID_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: The portfolio_id is not a valid UUID.
  - name: PORTFOLIO_USERS_CURSOR_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: The pagination cursor does not match any user in the result set.
  - name: PORTFOLIO_USERS_LIMIT_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: The limit parameter for portfolio users is out of the valid range.
  - name: PORTFOLIO_BALANCES_INVALID_ARGUMENT
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: The portfolio balances request contains an invalid cursor or filter.
  - name: PORTFOLIO_BALANCES_NOT_FOUND
    errorCode: RESOURCE_NOT_FOUND
    httpStatus: 404
    description: No balances were found for the requested portfolio.
  - name: ALLOCATION_ID_REQUIRED
    errorCode: REQUIRED_FIELD_MISSING
    httpStatus: 400
    description: The allocation_id field is required but was not provided.
  - name: ALLOCATION_ID_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: The allocation_id field is not a valid UUID.
  - name: ALLOCATION_NOT_FOUND
    errorCode: RESOURCE_NOT_FOUND
    httpStatus: 404
    description: "The requested allocation could not be found, either because it does\
      \ not exist or because the orders being allocated could not be retrieved."
  - name: ALLOCATION_NETTING_ID_REQUIRED
    errorCode: REQUIRED_FIELD_MISSING
    httpStatus: 400
    description: The netting_id field is required but was not provided.
  - name: ALLOCATION_NETTING_ID_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: The netting_id field is not a valid UUID.
  - name: ALLOCATION_REQUEST_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: "One or more allocation request fields, such as product_id, order_ids,\
      \ allocation_legs, or size_type, are missing or invalid."
  - name: ALLOCATION_START_DATE_REQUIRED
    errorCode: REQUIRED_FIELD_MISSING
    httpStatus: 400
    description: The start_date field is required when listing portfolio allocations.
  - name: ALLOCATION_PRECONDITION_FAILED
    errorCode: FAILED_PRECONDITION
    httpStatus: 400
    description: The allocation could not be processed because buying power or account
      information for the source or destination portfolio could not be retrieved.
  - name: ALLOCATION_SOURCE_PORTFOLIO_ID_REQUIRED
    errorCode: REQUIRED_FIELD_MISSING
    httpStatus: 400
    description: The source_portfolio_id field is required to identify the portfolio
      the allocation is coming from.
  - name: ALLOCATION_DESTINATION_PORTFOLIO_ID_REQUIRED
    errorCode: REQUIRED_FIELD_MISSING
    httpStatus: 400
    description: One or more entries in allocation_legs is missing a destination_portfolio_id.
  - name: ALLOCATION_ORDERS_MIXED_SIDES
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: The orders referenced in order_ids include both buy and sell sides.
      All orders in a single allocation request must share the same side.
  - name: ALLOCATION_ORDERS_MIXED_PRODUCTS
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: The orders referenced in order_ids span more than one product. All
      orders in a single allocation request must be for the same product_id.
  - name: ALLOCATION_ORDER_NOT_TERMINAL
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: "At least one order in order_ids has not reached a terminal state,\
      \ so it cannot be allocated until it finishes processing."
  - name: ALLOCATION_ORDER_TOO_OLD
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: At least one order in order_ids exceeds the maximum age allowed for
      allocation and can no longer be allocated.
  - name: ALLOCATION_ORDER_ALREADY_ALLOCATED
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: At least one order in order_ids has already been allocated and cannot
      be allocated again.
  - name: ALLOCATION_LIMIT_EXCEEDED
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: The limit field exceeds the maximum number of allocations that can
      be returned in a single request.
  - name: TRANSACTION_NOT_FOUND
    errorCode: RESOURCE_NOT_FOUND
    httpStatus: 404
    description: "The requested transaction could not be found for this portfolio,\
      \ or a transaction referenced in transaction_ids does not belong to it."
  - name: TRANSACTION_TRAVEL_RULE_DATA_NOT_FOUND
    errorCode: RESOURCE_NOT_FOUND
    httpStatus: 404
    description: No travel rule data is available for the specified transaction.
  - name: TRANSACTION_TYPE_UNSUPPORTED
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: "The transaction does not support the requested operation, such as\
      \ submitting travel rule data for a transaction that is not a deposit."
  - name: TRANSACTION_TRAVEL_RULE_PARTY_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: The originator or beneficiary information provided for the travel
      rule submission is missing or fails identity validation.
  - name: TRANSACTION_ID_REQUIRED
    errorCode: REQUIRED_FIELD_MISSING
    httpStatus: 400
    description: The transaction_id field is required but was not provided.
  - name: TRANSACTION_ID_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: The transaction_id field is not a valid UUID.
  - name: TRANSACTION_LIMIT_EXCEEDED
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: The limit field exceeds the maximum number of transactions that can
      be returned in a single request.
  - name: TRANSACTION_SERVICE_UNAVAILABLE
    errorCode: SERVICE_UNAVAILABLE
    httpStatus: 503
    description: The transaction data needed to fulfill this request is temporarily
      unavailable.
  - name: TRANSACTION_CURSOR_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: The cursor field is not a valid pagination token. Omit it or use
      the cursor value returned from a previous response.
  - name: TRANSACTION_TRAVEL_RULE_STATUS_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: The travel_rule_status filter contains a value that is not recognized.
  - name: TRANSACTION_FILTER_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: "The combination of request filters is invalid, such as specifying\
      \ symbols together with the ONCHAIN_TRANSACTION type."
  - name: TRANSACTION_IDS_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: "One or more values in transaction_ids are missing, exceed the maximum\
      \ allowed count, or are not valid UUIDs."
  - name: TRANSACTION_PARAMS_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: "One or more request parameters, such as portfolio_id, transaction_ids,\
      \ cursor, or limit, failed validation."
  - name: FINANCING_START_DATE_REQUIRED
    errorCode: REQUIRED_FIELD_MISSING
    httpStatus: 400
    description: The start_date field is required but was not provided.
  - name: FINANCING_END_DATE_REQUIRED
    errorCode: REQUIRED_FIELD_MISSING
    httpStatus: 400
    description: The end_date field is required but was not provided.
  - name: FINANCING_START_DATE_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: The start_date value is not a valid RFC 3339 timestamp.
  - name: FINANCING_END_DATE_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: The end_date value is not a valid RFC 3339 timestamp.
  - name: FINANCING_PORTFOLIO_MARGIN_NOT_ENABLED
    errorCode: AUTHENTICATION_FAILED
    httpStatus: 401
    description: "Portfolio margin is not enabled for the requested portfolio or entity,\
      \ so this financing endpoint cannot return data."
  - name: FINANCING_ACCRUALS_INVALID_ARGUMENT
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: "One or more parameters in the interest accruals request are invalid,\
      \ such as entity_id, portfolio_id, start_date, or end_date."
  - name: FINANCING_ACCRUALS_DATE_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: The start_date to end_date range provided for interest accruals is
      not valid for the requested portfolio.
  - name: BUYING_POWER_BASE_CURRENCY_REQUIRED
    errorCode: REQUIRED_FIELD_MISSING
    httpStatus: 400
    description: The base_currency field is required but was not provided.
  - name: BUYING_POWER_QUOTE_CURRENCY_REQUIRED
    errorCode: REQUIRED_FIELD_MISSING
    httpStatus: 400
    description: The quote_currency field is required but was not provided.
  - name: BUYING_POWER_CURRENCY_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: The requested currency pair is not valid or not supported for buying
      power.
  - name: BUYING_POWER_NOT_FOUND
    errorCode: RESOURCE_NOT_FOUND
    httpStatus: 404
    description: No buying power data was found for the requested portfolio and currency
      pair.
  - name: BUYING_POWER_PERMISSION_DENIED
    errorCode: PERMISSION_DENIED
    httpStatus: 403
    description: You do not have permission to view buying power for the requested
      portfolio and currency pair.
  - name: BUYING_POWER_FAILED_PRECONDITION
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: "The buying power request failed a precondition, such as the portfolio\
      \ not being in a state that supports the requested currency pair."
  - name: CROSS_MARGIN_NOT_ENABLED
    errorCode: PERMISSION_DENIED
    httpStatus: 403
    description: Cross margin is not enabled for the requested entity.
  - name: CROSS_MARGIN_INVALID_ARGUMENT
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: "The cross margin or funding settings request contains an invalid\
      \ argument, such as a portfolio_id, entity_id, or liquidation_id that does not\
      \ belong to the specified entity."
  - name: CROSS_MARGIN_FAILED_PRECONDITION
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: "The cross margin or funding settings request failed a precondition,\
      \ such as the entity or portfolio not being in a state that supports the requested\
      \ operation."
  - name: LOCATE_DATE_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: The locate_date value is not a valid YYYY-MM-DD date.
  - name: LOCATE_REQUEST_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: "The stock locate request is invalid — for example, both locate_date\
      \ and locate_ids are missing, or the requested locate_date is in the past or\
      \ too far in the future."
  - name: LOCATE_IDS_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: One or more values in locate_ids are not valid UUIDs.
  - name: LOCATE_FAILED_PRECONDITION
    errorCode: FAILED_PRECONDITION
    httpStatus: 400
    description: "The stock locate request failed a precondition, such as no availability\
      \ for the requested currency or portfolio margin not being enabled."
  - name: LOCATE_DATE_REQUIRED
    errorCode: REQUIRED_FIELD_MISSING
    httpStatus: 400
    description: The locate_date field is required but was not provided.
  - name: MARGIN_SUMMARY_RANGE_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: The requested start_date to end_date range exceeds the maximum trailing
      period of 3 months for margin summaries.
  - name: FINANCING_SERVICE_UNAVAILABLE
    errorCode: SERVICE_UNAVAILABLE
    httpStatus: 503
    description: Financing data cannot be retrieved right now. This is a service-wide
      condition unrelated to your request or account.
  - name: MARGIN_CONVERSION_REQUEST_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: "One or more parameters in the margin conversions request are invalid,\
      \ such as portfolio_id, start_date, or end_date."
  - name: LOCATE_AVAILABILITY_NOT_FOUND
    errorCode: RESOURCE_NOT_FOUND
    httpStatus: 404
    description: No locate availability data was found for the requested entity and
      date.
  - name: MARGIN_INFORMATION_REQUEST_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: "One or more parameters in the margin information request are invalid,\
      \ such as entity_id."
  - name: MARGIN_CONVERSION_FAILED_PRECONDITION
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: "The margin conversions request failed a precondition, such as the\
      \ portfolio not being in a state that supports margin conversions."
  - name: MARGIN_SUMMARY_FAILED_PRECONDITION
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: "The margin summaries request failed a precondition, such as the\
      \ entity not being in a state that supports margin summaries."
  - name: FUNDING_SETTINGS_EXCESS_TARGET_AMOUNT_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: "The excess_funds_target_amount field is missing, is not a valid\
      \ decimal number, or is negative."
  - name: FINANCING_WITHDRAWAL_POWER_INVALID_ARGUMENT
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: "One or more parameters in the withdrawal power request are invalid,\
      \ such as portfolio_id or symbol."
  - name: FINANCING_WITHDRAWAL_POWER_SYMBOL_REQUIRED
    errorCode: REQUIRED_FIELD_MISSING
    httpStatus: 400
    description: The symbol field is required but was not provided.
  - name: FINANCING_PTC_DISABLED_FOR_PM_ENTITY
    errorCode: RESOURCE_NOT_FOUND
    httpStatus: 404
    description: Post-trade credit information is not available for this portfolio
      because its entity has portfolio margin enabled.
  - name: FINANCING_FAILED_PRECONDITION
    errorCode: FAILED_PRECONDITION
    httpStatus: 400
    description: "The interest accruals request failed a precondition, such as an\
      \ invalid date range for the requested entity or portfolio."
  - name: FINANCING_ACCRUALS_RANGE_EXCEEDED
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: The requested start_date to end_date range exceeds the maximum trailing
      period of 12 months for interest accruals.
  - name: TIERED_PRICING_EFFECTIVE_AT_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: The effective_at value is not a valid RFC 3339 timestamp.
  - name: TIERED_PRICING_REQUEST_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: "One or more parameters in the tiered pricing request are invalid,\
      \ such as entity_id or effective_at."
  - name: TIERED_PRICING_FAILED_PRECONDITION
    errorCode: FAILED_PRECONDITION
    httpStatus: 400
    description: "The tiered pricing request failed a precondition, such as the entity\
      \ not being enabled for tiered pricing."
  - name: LOCATE_SYMBOL_REQUIRED
    errorCode: REQUIRED_FIELD_MISSING
    httpStatus: 400
    description: The symbol field is required but was not provided.
  - name: LOCATE_AMOUNT_REQUIRED
    errorCode: REQUIRED_FIELD_MISSING
    httpStatus: 400
    description: The amount field is required but was not provided.
  - name: REWARDS_API_FEATURE_DISABLED
    errorCode: PERMISSION_DENIED
    httpStatus: 403
    description: The Rewards Rate API is not enabled for this entity or portfolio.
  - name: REWARDS_REQUEST_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: The rewards rate request is invalid.
  - name: REWARDS_ENTITY_NOT_ENROLLED
    errorCode: FAILED_PRECONDITION
    httpStatus: 400
    description: The entity is not enrolled in Prime Rewards.
  - name: CANDLE_REQUEST_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: "The request for candle data is invalid because a field, such as\
      \ start_time or end_time, is missing or malformed."
  - name: CANDLE_TIME_RANGE_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: The requested start_time and end_time combination is not a valid
      candle time range for the given granularity.
  - name: PRODUCT_FUTURES_NOT_ENABLED
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: Futures products are not enabled for the specified portfolio_id.
  - name: PRODUCT_NOT_FOUND
    errorCode: RESOURCE_NOT_FOUND
    httpStatus: 404
    description: No products were found matching the requested criteria.
  - name: PRODUCT_LIMIT_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: The limit field must be a positive number.
  - name: PRODUCT_OPTIONS_NOT_ENABLED
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: Options products are not enabled for the specified portfolio_id.
  - name: ACTIVITY_NOT_FOUND
    errorCode: RESOURCE_NOT_FOUND
    httpStatus: 404
    description: "The requested activity could not be found, either because the activity_id\
      \ does not exist or it does not belong to the specified portfolio_id."
  - name: ACTIVITY_REQUEST_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: "The activity request contains an invalid argument, such as a malformed\
      \ filter or identifier."
  - name: ACTIVITY_ACCESS_DENIED
    errorCode: PERMISSION_DENIED
    httpStatus: 403
    description: You do not have permission to access the requested activity data
      for the given entity or portfolio.
  - name: ACTIVITY_CATEGORY_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: The categories field contains a value that is not a supported activity
      category.
  - name: ACTIVITY_TIME_RANGE_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: "The start_time or end_time field is not a valid RFC 3339 timestamp,\
      \ or end_time is earlier than start_time."
  - name: ACTIVITY_STATUS_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: The statuses field contains a value that is not a supported activity
      status.
  - name: ACTIVITY_PORTFOLIO_ID_MISMATCH
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: The requested activity exists but does not belong to the portfolio_id
      provided in the request.
  - name: ASSET_NOT_FOUND
    errorCode: RESOURCE_NOT_FOUND
    httpStatus: 404
    description: "The requested asset could not be found, for example because the\
      \ currency symbol or asset identifier does not correspond to a supported asset."
  - name: ASSET_REQUEST_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: "The asset lookup request contains an invalid argument, such as an\
      \ unsupported currency symbol or malformed asset identifier."
  - name: ASSET_SERVICE_UNAVAILABLE
    errorCode: SERVICE_UNAVAILABLE
    httpStatus: 503
    description: Asset information could not be retrieved at this time.
  - name: ADDRESS_BOOK_NOT_FOUND
    errorCode: RESOURCE_NOT_FOUND
    httpStatus: 404
    description: The requested address book entry could not be found for the given
      portfolio_id.
  - name: ADDRESS_BOOK_INVALID_ARGUMENT
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: "The address book request contains an invalid argument, such as a\
      \ malformed address or currency_symbol."
  - name: ADDRESS_BOOK_FAILED_PRECONDITION
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: The address book entry could not be created or retrieved because
      a precondition was not met.
  - name: ADDRESS_BOOK_ADDRESS_REQUIRED
    errorCode: REQUIRED_FIELD_MISSING
    httpStatus: 400
    description: The address field is required to create an address book entry.
  - name: ADDRESS_BOOK_CURRENCY_SYMBOL_REQUIRED
    errorCode: REQUIRED_FIELD_MISSING
    httpStatus: 400
    description: The currency_symbol field is required to create an address book entry.
  - name: ADDRESS_BOOK_NAME_REQUIRED
    errorCode: REQUIRED_FIELD_MISSING
    httpStatus: 400
    description: The name field is required to create an address book entry.
  - name: PAYMENT_METHOD_ID_REQUIRED
    errorCode: REQUIRED_FIELD_MISSING
    httpStatus: 400
    description: The payment_method_id field is required but was not provided.
  - name: PAYMENT_METHOD_ID_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: The payment_method_id field is not a valid identifier.
  - name: PAYMENT_METHOD_NOT_FOUND
    errorCode: RESOURCE_NOT_FOUND
    httpStatus: 404
    description: "The requested payment method could not be found, either because\
      \ the payment_method_id does not exist or it does not belong to the specified\
      \ entity_id."
  - name: PAYMENT_METHOD_REQUEST_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: The payment method request contains an invalid argument.
  - name: ENTITY_POSITION_LIMIT_INVALID
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: The limit field must be greater than 0 and no greater than the maximum
      allowed value.
  - name: ENTITY_POSITION_NOT_FOUND
    errorCode: RESOURCE_NOT_FOUND
    httpStatus: 404
    description: No position data was found for the given entity or portfolio.
  - name: ENTITY_POSITION_INVALID_ARGUMENT
    errorCode: VALIDATION_ERROR
    httpStatus: 400
    description: "The position request contains an invalid argument, such as a malformed\
      \ portfolio_id or other filter."
  - name: FCM_BALANCE_NOT_FOUND
    errorCode: RESOURCE_NOT_FOUND
    httpStatus: 404
    description: No futures balance data was found for the given entity_id.
  - name: FCM_INVALID_ARGUMENT
